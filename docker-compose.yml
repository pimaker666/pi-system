services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 构建期注入（NEXT_PUBLIC_* 会被内联进前端 bundle）
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    image: pi-system:latest
    container_name: pi-system
    restart: unless-stopped
    ports:
      # 宿主机 80 -> 容器 3000；若 80 被占或想先测试可改成 "3000:3000"
      - "80:3000"
    environment:
      # 运行期变量（服务端读取；service_role 仅服务端用，切勿加 NEXT_PUBLIC_ 前缀）
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    env_file:
      - .env.production
